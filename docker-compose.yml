services:
  db:
    image: postgres:16-alpine
    container_name: studyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyflow}
      POSTGRES_DB: ${POSTGRES_DB:-studyflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyflow} -d ${POSTGRES_DB:-studyflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
